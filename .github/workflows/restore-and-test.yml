name: Restore and test six-weapon source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-and-test.yml'
      - 'source-parts/**'
      - 'unpack.mjs'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore game sources
        run: node unpack.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run nine battle tests
        run: npm test
      - name: Commit readable source files
        run: |
          git add server.js public/game.js public/style.css tests/engine.test.js
          if git diff --cached --quiet; then
            echo "Readable files are already up to date"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Restore verified six-weapon game sources"
            git push
          fi
